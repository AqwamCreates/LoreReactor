name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (preserving lockfile on Linux)
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("package-lock.json")) {
              const lock = fs.readFileSync("package-lock.json", "utf8")
                .replace(/"os":\s*\[\s*"win32"\s*\]/g, "\"os\": [\"win32\", \"linux\"]");
              fs.writeFileSync("package-lock.json", lock);
            }
          '
          npm install --ignore-scripts --force --no-audit

      - name: Build Vite frontend
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
